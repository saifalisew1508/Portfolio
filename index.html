<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saif Ali Official Website</title>
    <meta name="description" content="Contact Page.">
    <meta name="keywords" content="Saif Ali, Developer, Portfolio, Contact">
    <meta name="author" content="Saif Ali">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/css/animate.css">
    <link rel="preload" href="https://fonts.googleapis.com/css?family=Sofia" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia">
    </noscript>

    <!-- Scripts -->
    <script src="assets/js/vanilla-tilt.js" defer></script>
    <script src="assets/js/wow.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js" defer></script>
</head>

<body>
    <!-- Day and Night Switch Toggle -->
    <div class="toggle-switch">
        <input type="checkbox" id="theme-toggle" />
        <label for="theme-toggle" class="toggle-label">
            <span class="toggle-icon sun">☀️</span>
            <span class="toggle-icon moon">🌙</span>
        </label>
    </div>

    <main class="container">
        <div class="card wow fadeInUp" data-tilt>
            <div id="card-particles" aria-hidden="true"></div>
            <div class="card-content">
                <img src="assets/images/saifalisew1508.png" alt="Saif Ali" class="wow fadeInUp" data-wow-duration="0.4s" data-wow-delay="0.2s">
                <h1 class="wow fadeInUp" data-wow-duration="0.8s" data-wow-delay="0.6s">Saif Ali</h1>
                <p class="wow fadeInUp" data-wow-duration="0.8s" data-wow-delay="0.6s">Self Taught Developer.</p>
                <div class="links wow fadeInUp" data-wow-duration="0.8s" data-wow-delay="0.8s">
                    <a href="https://github.com/saifalisew1508"><img src="assets/images/Github.png" alt="GitHub"></a>
                    <a href="https://facebook.com/saifalisew1508"><img src="assets/images/facebook.png" alt="Facebook"></a>
                    <a href="https://twitter.com/saifalisew1508"><img src="assets/images/twitter.png" alt="Twitter"></a>
                    <a href="https://t.me/DearSaif"><img src="assets/images/telegram.png" alt="Telegram"></a>
                    <a href="https://instagram.com/saifaliopp"><img src="assets/images/Instagram.png" alt="Instagram"></a>
                    <a href="https://pinterest.com/saifalisew1508"><img src="assets/images/pinterest.png" alt="Pinterest"></a>
                    <a href="https://www.reddit.com/user/saifalisew1508"><img src="assets/images/reddit.png" alt="Reddit"></a>
                    <a href="http://discordapp.com/users/927678863864131584"><img src="assets/images/discord.png" alt="Discord"></a>
                </div>
                <a href="https://website-saifalisew1508.vercel.app/" class="btn wow fadeInUp" data-wow-duration="0.8s" data-wow-delay="0.8s">View Portfolio</a>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script>
        window.addEventListener('DOMContentLoaded', function () {
            new WOW().init();

            particlesJS.load('card-particles', 'assets/particlesjs-config.json');

            // Day and Night Toggle Script
            document.getElementById('theme-toggle').addEventListener('change', function () {
                document.body.classList.toggle('night-mode');
            });
        });
    </script>
</body>

</html>
